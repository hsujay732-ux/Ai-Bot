name: Make voiceover

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "auto / sarvam / edge (auto = sarvam if SARVAM_API_KEY secret exists)"
        default: "auto"
      voice:
        description: "Blank = default. Sarvam: shubh, aditya, rahul, amit, kabir, priya, neha, shreya, ishita... Edge: hi-IN-MadhurNeural, hi-IN-SwaraNeural"
        default: ""
      rate:
        description: "Speed, e.g. +0%, +10%, -5%"
        default: "+0%"
  push:
    paths:
      - "input/**"

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Make voice + video
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          ENGINE: ${{ github.event.inputs.engine }}
          VOICE: ${{ github.event.inputs.voice }}
          RATE: ${{ github.event.inputs.rate }}
        run: python voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: voiceover
          path: |
            output/final.mp4
            output/voice.m4a
      - name: Save final video to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/final.mp4 output/voice.m4a
          git commit -m "Voiceover output [skip ci]" || exit 0
          git push
