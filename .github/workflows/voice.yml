name: Make voiceover

on:
  workflow_dispatch:
    inputs:
      dir:
        description: "Project folder (script.txt, scenes.txt, video.mp4)"
        default: "input"
      engine:
        description: "auto / sarvam / edge / clone / eleven (eleven = ElevenLabs, voice me Voice ID do)"
        default: "auto"
      voice:
        description: "Blank = default. Eleven: Voice ID. Clone: voices/sujay.wav. Sarvam: shubh, aditya, rahul, amit, kabir, priya, neha, shreya, ishita... Edge: hi-IN-MadhurNeural, hi-IN-SwaraNeural"
        default: ""
      rate:
        description: "Speed, e.g. +0%, +10%, -5%"
        default: "+0%"
      pitch:
        description: "Pitch (edge voices), e.g. -8Hz"
        default: "+0Hz"
      fx:
        description: "Audio effect: warm (bhaari, soft narrator) ya blank"
        default: ""
  push:
    paths:
      - "input/**"

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        if: github.event.inputs.engine == 'clone'
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-mtl
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          if [ "${{ github.event.inputs.engine }}" = "clone" ]; then pip install chatterbox-tts; fi
      - name: Make voice + video
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ENGINE: ${{ github.event.inputs.engine }}
          VOICE: ${{ github.event.inputs.voice }}
          RATE: ${{ github.event.inputs.rate }}
          PITCH: ${{ github.event.inputs.pitch }}
          FX: ${{ github.event.inputs.fx }}
        run: |
          D="${{ github.event.inputs.dir || 'input' }}"
          python voice.py --script "$D/script.txt" --scenes "$D/scenes.txt" --video "$D/video.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: voiceover
          path: output/
          if-no-files-found: ignore
      - name: Save final video to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/final.mp4 output/voice.m4a 2>/dev/null || git add -f output/voice.m4a
          git commit -m "Voiceover output [skip ci]" || exit 0
          git push
